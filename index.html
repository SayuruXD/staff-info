<!DOCTYPE html>
<html>
<head>
  <title>Minecone Network Staff Info</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e1e1e, #2f2f2f);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: #2b2b2b;
      padding: 25px;
      width: 420px;
      border-radius: 12px;
      box-shadow: 0 8px 0 #111, 0 0 20px rgba(0,0,0,0.6);
      position: relative;
      padding-bottom: 70px;
    }
    h2 { text-align: center; margin-bottom: 15px; color: #55ff55; line-height: 1.3; }
    .title-main { font-size: 22px; font-weight: bold; }
    .title-sub { font-size: 16px; color: #aaa; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #1a1a1a;
      color: white;
      box-shadow: inset 0 3px 5px #000;
    }
    input:focus, select:focus { border: 1px solid #55ff55; }
    .nav-btn {
      position: absolute;
      bottom: 15px;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .next-btn { right: 15px; background: #55ff55; box-shadow: 0 3px 0 #2a8f2a; }
    .back-btn { left: 15px; background: #555; box-shadow: 0 3px 0 #222; }
    .submit-btn { right: 15px; background: #00c3ff; box-shadow: 0 3px 0 #006a8c; }
    .nav-btn:hover { transform: translateY(-1px); }
    .nav-btn:active { transform: translateY(2px); }
    .step { transition: all 0.3s ease; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>
    <span class="title-main">Minecone Network</span><br>
    <span class="title-sub">Staff Info Form</span>
  </h2>

  <form id="staffForm">
    <!-- STEP 1 -->
    <div class="step" id="step1">
      <input type="text" id="ign" placeholder="Minecraft IGN" required>
      <input type="text" id="discord" placeholder="Discord Username (ex: Name#1234)" required>
      <button type="button" class="nav-btn next-btn">Next ➜</button>
    </div>

    <!-- STEP 2 -->
    <div class="step hidden" id="step2">
      <select id="rank" required>
        <option value="">Select Staff Rank</option>
        <option value="Founder">👑 Founder</option>
        <option value="Co-Founder">🔒 Co-Founder</option>
        <option value="Head of Staff">🧠 Head of Staff</option>
        <option value="Head Manager">⚙️ Head Manager</option>
        <option value="Manager">⚙️ Manager</option>
        <option value="Senior Administrator">⚔️ Senior Administrator</option>
        <option value="Administrator">⚔️ Administrator</option>
        <option value="Developers">⚙️ Developers</option>
        <option value="Senior Moderator">🛡️ Senior Moderator</option>
        <option value="Moderator">🛡️ Moderator</option>
        <option value="Junior Moderator">🛡️ Junior Moderator</option>
        <option value="Helper">💬 Helper</option>
        <option value="Trial Staff">🚧 Trial Staff</option>
      </select>
      <button type="button" class="nav-btn back-btn">⬅ Back</button>
      <button type="submit" class="nav-btn submit-btn">Submit 🚀</button>
    </div>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyVywoKPdMAXbB0NV-CDSxJvc6sJQYU5q_09hxj3T0y51RtbPo_kB1R4OnaSQRPmtT7/exec";

  let submitted = false;

  const step1 = document.getElementById("step1");
  const step2 = document.getElementById("step2");
  const nextBtn = step1.querySelector(".next-btn");
  const backBtn = step2.querySelector(".back-btn");
  const submitBtn = step2.querySelector(".submit-btn");
  const form = document.getElementById("staffForm");

  function showStep(stepNum) {
    if(stepNum === 1) { step1.classList.remove("hidden"); step2.classList.add("hidden"); }
    if(stepNum === 2) { step1.classList.add("hidden"); step2.classList.remove("hidden"); }
  }

  // NEXT button
  nextBtn.addEventListener("click", function(e) {
    e.preventDefault();
    const ign = document.getElementById("ign").value.trim();
    const discord = document.getElementById("discord").value.trim();
    if(!ign || !discord) {
      alert("Please fill all fields!");
      return;
    }
    showStep(2);
  });

  // BACK button
  backBtn.addEventListener("click", function(e) {
    e.preventDefault();
    showStep(1);
  });

  // SUBMIT form
  form.addEventListener("submit", function(e) {
    e.preventDefault();
    if(submitted) return;
    submitted = true;

    submitBtn.innerText = "Sending...";
    submitBtn.disabled = true;

    fetch("https://script.google.com/macros/s/AKfycbyVywoKPdMAXbB0NV-CDSxJvc6sJQYU5q_09hxj3T0y51RtbPo_kB1R4OnaSQRPmtT7/exec", {
      method: "POST",
      mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        ign: document.getElementById("ign").value,
        discord: document.getElementById("discord").value,
        rank: document.getElementById("rank").value
      })
    })
    .then(res => res.json())
    .then(data => {
      if(data.status === "success") {
        alert("Staff info submitted!");
        location.reload();
      } else {
        throw new Error(data.message || "Unknown error");
      }
    })
    .catch(err => {
      alert("Error submitting form: " + err.message);
      submitBtn.innerText = "Submit 🚀";
      submitBtn.disabled = false;
      submitted = false;
      console.error(err);
    });
  });
});
</script>

</body>
</html>
