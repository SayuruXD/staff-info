<!DOCTYPE html>
<html>
<head>
  <title>Minecone Network Staff Info</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e1e1e, #2f2f2f);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .card {
      background: #2b2b2b;
      padding: 25px;
      width: 420px;
      border-radius: 12px;
      box-shadow: 0 8px 0 #111, 0 0 20px rgba(0,0,0,0.6);
      position: relative;
      padding-bottom: 70px;
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #55ff55;
      line-height: 1.3;
    }

    .title-main { font-size: 22px; font-weight: bold; }
    .title-sub { font-size: 16px; color: #aaa; }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #1a1a1a;
      color: white;
      box-shadow: inset 0 3px 5px #000;
    }

    input:focus, select:focus { border: 1px solid #55ff55; }

    .nav-btn {
      position: absolute;
      bottom: 15px;
      padding: 8px 14px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .next-btn { right: 15px; background: #55ff55; box-shadow: 0 3px 0 #2a8f2a; }
    .back-btn { left: 15px; background: #555; box-shadow: 0 3px 0 #222; }
    .submit-btn { right: 15px; background: #00c3ff; box-shadow: 0 3px 0 #006a8c; }

    .nav-btn:hover { transform: translateY(-1px); }
    .nav-btn:active { transform: translateY(2px); }

    .step { transition: all 0.3s ease; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>
    <span class="title-main">Minecone Network</span><br>
    <span class="title-sub">Staff Info Form</span>
  </h2>

  <form id="staffForm">
    <!-- STEP 1 -->
    <div class="step" id="step1">
      <input type="text" id="ign" placeholder="Minecraft IGN" required>
      <input type="text" id="discord" placeholder="Discord Username (ex: Name#1234)" required>
      <button type="button" class="nav-btn next-btn" onclick="nextStep()">Next ➜</button>
    </div>

    <!-- STEP 2 -->
    <div class="step hidden" id="step2">
      <select id="rank" required>
        <option value="">Select Staff Rank</option>
        <option value="Founder">👑 Founder</option>
        <option value="Co-Founder">🔒 Co-Founder</option>
        <option value="Head of Staff">🧠 Head of Staff</option>
        <option value="Head Manager">⚙️ Head Manager</option>
        <option value="Manager">⚙️ Manager</option>
        <option value="Senior Administrator">⚔️ Senior Administrator</option>
        <option value="Administrator">⚔️ Administrator</option>
        <option value="Developers">⚙️ Developers</option>
        <option value="Senior Moderator">🛡️ Senior Moderator</option>
        <option value="Moderator">🛡️ Moderator</option>
        <option value="Junior Moderator">🛡️ Junior Moderator</option>
        <option value="Helper">💬 Helper</option>
        <option value="Trial Staff">🚧 Trial Staff</option>
      </select>
      <button type="button" class="nav-btn back-btn" onclick="prevStep()">⬅ Back</button>
      <button type="submit" class="nav-btn submit-btn">Submit 🚀</button>
    </div>
  </form>
</div>

<script>
let currentStep = 1;
let submitted = false;

function nextStep() {
  const step = document.getElementById("step" + currentStep);
  const inputs = step.querySelectorAll("input, select");

  for (let inp of inputs) {
    if (inp.required && inp.value.trim() === "") {
      alert("Please fill this field!");
      return;
    }
  }

  step.classList.add("hidden");
  currentStep++;
  document.getElementById("step" + currentStep).classList.remove("hidden");
}

function prevStep() {
  document.getElementById("step" + currentStep).classList.add("hidden");
  currentStep--;
  document.getElementById("step" + currentStep).classList.remove("hidden");
}

document.getElementById("staffForm").addEventListener("submit", function(e) {
  e.preventDefault();
  if (submitted) return;
  submitted = true;

  const btn = document.querySelector(".submit-btn");
  btn.innerText = "Sending...";
  btn.disabled = true;

  fetch("https://script.google.com/macros/s/AKfycbzpFLDD0MntfM9F5sRiN1eddcZKviw1JYOhpdGZn1wvRhIk1MwVHw3W3hpLcPoxWF8t/exec", {
    method: "POST",
    body: JSON.stringify({
      ign: document.getElementById("ign").value,
      discord: document.getElementById("discord").value,
      rank: document.getElementById("rank").value
    })
  })
  .then(res => res.text())
  .then(() => {
    alert("Staff info submitted!");
    location.reload();
  })
  .catch(err => {
    alert("Error submitting form");
    btn.innerText = "Submit 🚀";
    btn.disabled = false;
    submitted = false;
    console.error(err);
  });
});
</script>

</body>
</html>
